# 변경 기록 · 릴리즈 노트 (bc deploy 로 생성 · 프로토타입)
#
# 1. PR 이 main 에 머지되면 __CHANGELOG__ 의 "다음 릴리즈" 에 PR 제목을 한 줄 넣습니다.
#    분류는 PR 라벨 → 제목의 [feature] · [fix] → 브랜치 첫 토막(feature/…) 순서로 정하고, 못 정하면 기타입니다.
# 2. GitHub → Actions → "__WORKFLOW_NAME__" → Run workflow 에 버전(예: 1.2.0)을 넣으면
#    "다음 릴리즈" 를 그 버전으로 묶어 커밋하고, 태그 __TAG_PREFIX__1.2.0 으로 GitHub Release 를 만듭니다.
#
# 두 경우 모두 github-actions 가 main 에 직접 커밋합니다.
# main 에 보호 규칙(PR 필수 · 리뷰 필수)이 있으면 GitHub Actions 가 push 할 수 있게 예외를 주세요.
# PR 을 main 이 아닌 브랜치에 머지한다면 아래 branches 를 바꾸세요.
#
# 복사된 파일이므로 프로젝트 소유입니다. 자유롭게 수정하세요.

name: __WORKFLOW_NAME__

on:
  pull_request:
    types: [closed]
    branches: [main]
__PATHS__
  workflow_dispatch:
    inputs:
      version:
        description: '버전 (예: 1.2.0)'
        required: true

jobs:
  record:
    name: 변경 기록
    # 봇이 연 PR(의존성 업데이트 등)은 기록하지 않습니다.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      !endsWith(github.event.pull_request.user.login, '[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: CHANGELOG 에 PR 추가
        env:
          BRANCH: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          # 다른 기록과 동시에 push 하면 밀릴 수 있어서, 최신 커밋에 다시 적용해 재시도합니다.
          for i in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            node .github/scripts/changelog.mjs record --file "__CHANGELOG__" --name "__RELEASE_NAME__"
            git add "__CHANGELOG__"
            git diff --cached --quiet && exit 0
            git commit -m "docs: __CHANGELOG__ 에 #$PR_NUMBER 기록 [skip ci]"
            git push origin "HEAD:$BRANCH" && exit 0
            sleep $((RANDOM % 5 + 1))
          done
          echo "push 가 계속 밀려 기록하지 못했습니다. 이 workflow 를 다시 실행하세요."
          exit 1

  release:
    name: 릴리즈
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: __WORKFLOW_ID__-release
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 이전 릴리즈 태그를 읽어야 합니다.

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: CHANGELOG 를 버전으로 묶기
        id: notes
        env:
          BRANCH: ${{ github.ref_name }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          VERSION="$(echo "$VERSION_INPUT" | tr -d '[:space:]')"
          VERSION="${VERSION#v}"
          for i in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            node .github/scripts/changelog.mjs release --file "__CHANGELOG__" --name "__RELEASE_NAME__" --prefix "__TAG_PREFIX__" --version "$VERSION"
            git add "__CHANGELOG__"
            git commit -m "chore: __TAG_PREFIX__$VERSION 릴리즈 [skip ci]"
            if git push origin "HEAD:$BRANCH"; then
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((RANDOM % 5 + 1))
          done
          echo "push 가 계속 밀려 릴리즈하지 못했습니다. 다시 실행하세요."
          exit 1

      # CHANGELOG 를 묶은 커밋에 태그를 붙이고 Release 를 만듭니다.
      - name: GitHub Release 만들기
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.notes.outputs.tag }}
          TITLE: ${{ steps.notes.outputs.title }}
          SHA: ${{ steps.notes.outputs.sha }}
        run: gh release create "$TAG" --target "$SHA" --title "$TITLE" --notes-file notes.md --latest=__LATEST__
