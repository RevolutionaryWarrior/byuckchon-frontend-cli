# PR 본문에 커밋 내역을 자동으로 채워 넣습니다.
#
# 사람이 쓴 내용은 건드리지 않고, 아래 마커 사이만 갱신합니다.
#   <!-- byuckchon:commits:start --> ~ <!-- byuckchon:commits:end -->
# 마커가 없으면 본문 끝에 한 번 덧붙입니다. (PR 템플릿이 없어도 동작)
#
# 커밋 메시지를 `feat:` `fix:` 처럼 쓰면 타입별로 묶이고,
# 컨벤션을 안 지킨 커밋은 "분류 없음"으로 모입니다.
#
# 커밋 본문에 NOTE: 또는 TODO: 로 적은 줄은 "리뷰 포인트"로 따로 모입니다.
# AI 로 코드를 짤 때 "여긴 리뷰어가 봐야 한다"를 남겨두는 용도로 쓰세요.
#
# PR 제목에는 브랜치명의 첫 토막이 대괄호로 붙습니다.
#   feature/update-mypage-style/hyuk + "마이페이지 디자인 적용"
#     → "[feature] 마이페이지 디자인 적용"
# 사람이 쓴 제목은 그대로 두고 앞에만 붙이며, 이미 대괄호가 있으면 건드리지 않습니다.
#
# 복사된 파일이므로 프로젝트 소유입니다. 대상 브랜치 등은 자유롭게 수정하세요.

name: PR Description

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # 대상 브랜치를 제한하지 않습니다. PR 본문을 채우는 일이라
    # dev 든 main 이든 동작하는 편이 낫습니다.

concurrency:
  group: pr-description-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  describe:
    name: 커밋 내역 반영
    # changeset 릴리즈 PR 처럼 봇이 연 PR 은 본문을 그대로 둔다.
    if: ${{ !endsWith(github.event.pull_request.user.login, '[bot]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: PR 본문 갱신
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # 프로젝트가 고정한 settings 버전을 그대로 사용합니다.
          # (전체 의존성 설치 없이 이 패키지만 받아 실행)
          VERSION=$(node -p "const p=require('./package.json'); (p.devDependencies?.['@byuckchon-frontend/settings'] ?? p.dependencies?.['@byuckchon-frontend/settings'] ?? 'latest')")
          npx --yes --package "@byuckchon-frontend/settings@${VERSION}" byuckchon-pr-description
