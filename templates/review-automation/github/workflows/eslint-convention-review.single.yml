name: ESLint Convention Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - dev

concurrency:
  group: eslint-convention-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  eslint-conventions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: ESLint 컨벤션 리뷰 댓글
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npx eslint . \
            --config tools/review.config.mjs \
            --no-error-on-unmatched-pattern \
            -f node_modules/@byuckchon-frontend/settings/src/eslint/internal-rdjson-formatter.js \
            -o /tmp/eslint-conventions.rdjson || true
          npx --no-install byuckchon-eslint-review-comments \
            /tmp/eslint-conventions.rdjson \
            eslint-conventions