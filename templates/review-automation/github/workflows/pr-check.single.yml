# PR Check — 단일 프로젝트
#
# 기계적인 컨벤션은 ESLint Convention Review workflow 가 인라인 댓글로 알려주고,
# 이 workflow 는 "머지해도 되는가"(format / lint / typecheck / build 성공 여부)를 판정합니다.
#
# 프로젝트 사정에 맞게 자유롭게 수정하세요. 이 파일은 프로젝트 소유입니다.
#   - 대상 브랜치가 dev 가 아니라면 아래 branches 를 바꾸세요.
#   - 테스트가 있다면 마지막에 단계를 추가하세요.

# @bc:note 패키지 매니저 부분(__PM_*__, @bc:pm-setup)은 bc 가 복사할 때 프로젝트에 맞게 채웁니다.

name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - dev

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Format · Lint · Typecheck · Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # @bc:pm-setup

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: __PM_CACHE__

      - name: 의존성 설치
        run: __PM_INSTALL__

      - name: Format
        run: __PM_RUN__ format:check

      - name: Lint
        run: __PM_RUN__ lint

      - name: Typecheck
        run: __PM_RUN__ typecheck

      - name: Build
        run: __PM_RUN__ build
