# 운영 배포 + 릴리즈 노트 (bc deploy 로 생성 · 프로토타입)
#
# 배포(deploy)가 성공했을 때만 release job 이 돌아 태그와 GitHub Release 를 남깁니다.
# 실패한 배포는 기록되지 않으므로, 최신 Release = 지금 운영에 떠 있는 버전입니다.
#
# 복사된 파일이므로 프로젝트 소유입니다. 브랜치 · 배포 단계는 자유롭게 수정하세요.
# @bc:note 아래 # @bc:… 줄은 bc deploy 가 답변에 맞춰 지우거나 채웁니다.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 같은 브랜치 배포가 겹치면 앞의 것을 끝까지 마치고 다음 것을 실행합니다.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: 운영 배포
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      # @bc:pm-setup

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: __PM_CACHE__

      - run: __PM_INSTALL__
      - run: __PM_RUN__ build

      # TODO: S3 · Lightsail 배포 단계를 여기에 추가합니다.
      #   S3        → aws-actions/configure-aws-credentials + aws s3 sync
      #   Lightsail → 컨테이너 이미지 push + aws lightsail create-container-service-deployment
      - name: 배포 (TODO)
        run: |
          echo "배포 단계가 비어 있습니다. deploy.yml 의 TODO 를 채워주세요."
          exit 1

  # @bc:release-start
  release:
    name: 릴리즈 노트
    needs: deploy # 성공했을 때만
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # @bc:slack-start
    env:
      # 웹훅 URL 은 저장소 Secrets 에만 둡니다. (bc.config.json 에는 이름만)
      SLACK_WEBHOOK_URL: ${{ secrets.__SLACK_SECRET__ }}
    # @bc:slack-end

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 이전 태그 이후 커밋을 읽어야 합니다.
      # @bc:pm-setup

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: __PM_CACHE__

      - run: __PM_INSTALL__

      - id: notes
        run: __PM_EXEC__ byuckchon-release-notes --prefix "__TAG_PREFIX__" --version __VERSION__

      # 배포한 커밋(github.sha)에 태그를 붙입니다.
      - run: gh release create "${{ steps.notes.outputs.tag }}" --target "${{ github.sha }}" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
      # @bc:slack-start

      - if: env.SLACK_WEBHOOK_URL != ''
        run: __PM_EXEC__ byuckchon-release-notes --slack notes.md
      # @bc:slack-end
  # @bc:release-end
